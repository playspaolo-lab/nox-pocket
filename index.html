<script>
var LOTS=[{"id": "l20261116", "label": "Lot du 16 novembre 2026", "accounts": [{"id": "cade", "handle": "@cade.plum", "caption": "Some of the best work happens before anyone is awake. The streets are empty, the gym is quiet, and nobody is watching. That is exactly why it matters. Early hours are not about proving something to other people. They are about keeping a promise you made to yourself when it would be easier to stay in bed. A short run in the cold, a few rounds on the bag, one focused hour at the desk. None of it looks impressive in the moment. Over weeks and months, it adds up to a version of you that feels steady and earned. You do not need perfect conditions. You only need to start while it is still dark.\n\n#discipline #earlymorning #darkaesthetic #selfimprovement #routine", "video": "l20261116-cade-cade-web.mp4", "poster": "l20261116-cade-poster.jpg", "slides": []}, {"id": "lena", "handle": "@lena.fit2", "caption": "Some evenings the couch feels heavier than any weight in the gym. That is normal, and it does not mean the habit is gone. On tired days, make the session smaller instead of skipping it completely. Twenty minutes is still twenty minutes. Pick the machines you actually enjoy, keep the pace gentle, and let it be easy for once. You are not trying to win the day. You are just keeping the door open so tomorrow feels lighter. Most of the time you will walk out feeling better than you walked in, and that feeling is worth protecting. Show up softly, it still counts.\n\n#gymgirl #fitnessjourney #softdiscipline #womenwholift #gymmotivation", "slides": ["l20261116-lena-slide-01.jpg", "l20261116-lena-slide-02.jpg", "l20261116-lena-slide-03.jpg", "l20261116-lena-slide-04.jpg", "l20261116-lena-slide-05.jpg"]}, {"id": "cyra", "handle": "@cyra.volt4", "caption": "Some days get loud fast. Messages, tabs, notes everywhere, and a head that will not slow down. When that happens, you do not need a full reset or a perfect plan. Start with something small and physical. Open a window and let some air in. Tidy one little corner so your eyes have somewhere calm to land. Step outside for ten minutes without trying to be productive. Make a warm drink and sit with it for a moment. These are tiny things, but they give your mind a quieter place to restart from. You can pick the day back up from there, gently and on your own terms.\n\n#slowliving #selfcare #thatgirl #dailyroutine #mindfulmoments", "slides": ["l20261116-cyra-slide-01.jpg", "l20261116-cyra-slide-02.jpg", "l20261116-cyra-slide-03.jpg", "l20261116-cyra-slide-04.jpg", "l20261116-cyra-slide-05.jpg"]}, {"id": "restart", "handle": "@user7658638327909", "caption": "Coming back to the gym after a long break can feel strange. The room looks the same, but your body does not feel the same, and that is fine. The first session back is not the time to chase old numbers. Load the bar lighter than you think you need. Do the same warm up you always did so your body remembers the rhythm. Finish every set with one rep still in the tank. The goal today is simple: leave wanting to come back on Thursday. Strength returns faster than you expect when the restart is patient and steady. Nobody needs to see it. You will feel it.\n\n#gymrestart #comeback #mensfitness #strengthtraining #consistency", "slides": ["l20261116-restart-slide-01.jpg", "l20261116-restart-slide-02.jpg", "l20261116-restart-slide-03.jpg", "l20261116-restart-slide-04.jpg"]}, {"id": "royal", "handle": "@royal.discipline7", "caption": "The way you end your day quietly decides how the next one begins. Lately the evening looks simple. The phone charges in another room, far from the bed. Tomorrow's first task gets written down so the morning does not start with confusion. Clothes are laid out on the chair. A book gets twenty pages before sleep, and the lights go low after ten. None of this is complicated, and none of it is about being perfect. It is about removing small decisions so the mind can rest and the morning can start with intention. A calmer night is often the first step toward a better day.\n\n#eveningroutine #discipline #darkacademia #selfimprovement #mindset", "slides": ["l20261116-royal-slide-01.jpg", "l20261116-royal-slide-02.jpg", "l20261116-royal-slide-03.jpg", "l20261116-royal-slide-04.jpg", "l20261116-royal-slide-05.jpg", "l20261116-royal-slide-06.jpg", "l20261116-royal-slide-07.jpg"]}, {"id": "consistent", "handle": "@consistent.lifest", "caption": "Missing a day happens to everyone. A late night, a busy schedule, or simply no energy left. The mistake is not the missed day. The mistake is treating it like the whole plan is ruined. Today can still be a normal day. Make your coffee like always. Do your usual workout, even if it is a little shorter. Eat the meals you already planned to eat. Go to bed at a reasonable time. Consistency is not a perfect streak, it is the habit of coming back without drama. One day off is just one day off. It is not the story of your week unless you let it be.\n\n#consistency #healthyhabits #fitnessmotivation #dailyroutine #keepgoing", "slides": ["l20261116-consistent-slide-01.jpg", "l20261116-consistent-slide-02.jpg", "l20261116-consistent-slide-03.jpg", "l20261116-consistent-slide-04.jpg", "l20261116-consistent-slide-05.jpg"]}, {"id": "undeniable", "handle": "@undeniable.lifest", "caption": "It is nine at night and you have two options. One is another hour of scrolling, watching other people live, train, travel and laugh. It feels like rest, but most of the time it leaves you more tired and a little empty. The other option is an hour you will actually remember. A run under the city lights, a focused study session, dinner with people you love, a few chapters of a good book. Same night, same hour, completely different feeling the next morning. You do not have to give up your phone forever. Just choose, every now and then, the version of the evening that gives something back to you.\n\n#digitaldetox #reallife #mindset #selfgrowth #nightroutine", "slides": ["l20261116-undeniable-slide-01.jpg", "l20261116-undeniable-slide-02.jpg", "l20261116-undeniable-slide-03.jpg", "l20261116-undeniable-slide-04.jpg"]}, {"id": "track", "handle": "@track.discipline", "caption": "When you look back at a week, the best moments are rarely the most productive ones. It is a slow walk on Sunday with nowhere to be. A long dinner with friends where nobody checks the time. A book you finally finished on an ordinary Tuesday evening. These small moments are easy to skip when life gets busy, but they are what make the weeks feel full instead of rushed. Try asking yourself what made this week good, and then make a little more room for those things next week. A good life is often built from simple, repeated moments that you actually show up for.\n\n#slowliving #weeklyreflection #simplepleasures #lifestyle #intentionalliving", "slides": ["l20261116-track-slide-01.jpg", "l20261116-track-slide-02.jpg", "l20261116-track-slide-03.jpg", "l20261116-track-slide-04.jpg"]}, {"id": "daily", "handle": "@daily.discipline951", "caption": "Mornings feel easier when the night before does a little of the work. It only takes about ten minutes. Hang your bag by the door so you do not have to look for it. Put a glass of water on the nightstand for when you wake up. Lay your outfit on the chair so there is one less decision at seven in the morning. Then turn the lights off a little earlier than usual and give yourself real rest. These are small habits, but together they make the start of the day calmer and more organized. A smoother morning really starts the evening before.\n\n#eveningroutine #cozyhome #morningroutine #selfcare #productivity", "slides": ["l20261116-daily-slide-01.jpg", "l20261116-daily-slide-02.jpg", "l20261116-daily-slide-03.jpg", "l20261116-daily-slide-04.jpg", "l20261116-daily-slide-05.jpg"]}, {"id": "good", "handle": "@good.motivation14", "caption": "A friend once said they did not have time to rest. The honest question back was simple: when did you last sit down, really sit down? Not to answer emails or scroll, but just to breathe for a moment. Rest is not laziness and it is not a reward you earn only after everything is done. It is part of the work, the part that lets you keep going. Sometimes it looks like coffee outside for ten quiet minutes. Sometimes it is lying on the couch while the late sun fills the room. Take the break before your body forces you to. You will come back clearer.\n\n#restisproductive #selfcare #slowdown #mentalhealth #balance", "slides": ["l20261116-good-slide-01.jpg", "l20261116-good-slide-02.jpg", "l20261116-good-slide-03.jpg", "l20261116-good-slide-04.jpg"]}, {"id": "self", "handle": "@self.discipline84", "caption": "Willpower gets most of the credit, but your space quietly makes a lot of decisions for you. If your desk is crowded, focus feels harder. If your phone charges next to your bed, the night ends and starts on a screen. Small changes can make the good choice the easy one. Clear the desk and keep only today's work in sight. Charge your phone outside the bedroom. Put your shoes somewhere you will see them in the morning so a walk or workout feels obvious. You do not need a whole new routine. Adjust your environment a little, and better habits start to feel natural.\n\n#selfdiscipline #habits #productivity #minimalism #selfimprovement", "slides": ["l20261116-self-slide-01.jpg", "l20261116-self-slide-02.jpg", "l20261116-self-slide-03.jpg", "l20261116-self-slide-04.jpg", "l20261116-self-slide-05.jpg"]}, {"id": "club", "handle": "@clubclff8lx", "caption": "Everyone walks into the gym with a different goal. Some want strength, some want to feel better, some just need an hour away from everything. Still, it is the same gym and the same hour, and after a while the faces become familiar. Someone counts your last reps, someone keeps you company on the warm up, someone runs the final lap beside you. Nobody trains alone for long in a place like that. That shared effort is often the real reason people keep coming back, long after the first motivation fades. Find your people, and the habit becomes much easier to keep.\n\n#gymcommunity #trainingpartners #fitnessfamily #blackandwhite #consistency", "slides": ["l20261116-club-slide-01.jpg", "l20261116-club-slide-02.jpg", "l20261116-club-slide-03.jpg", "l20261116-club-slide-04.jpg"]}, {"id": "energized", "handle": "@energized.discipl", "caption": "Most of the hard part is the first minute. Lacing your shoes, stepping outside, picking up the first weight. After that, momentum usually takes over. You do not need the perfect plan or a huge burst of motivation to begin. Start with a short run, a few rounds on the bag, one honest set. Then keep going a little longer than you planned, even on the days when your legs feel slow. Energy is often something you create by moving, not something you wait for before you move. If today feels heavy, make the start smaller and let the rest follow. Just start, and keep going.\n\n#juststart #workoutmotivation #running #fitness #keepgoing", "video": "l20261116-energized-energized-web.mp4", "poster": "l20261116-energized-poster.jpg", "slides": []}]}];
